plugins {
	id 'java'
	id 'org.springframework.boot' version '4.1.1'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'net.lavacro'
version = '2.1.1'
description = 'Spring Kafka consumer for firewall data'

def javaVersion = System.getProperty('os.arch') == 'aarch64' ? 27 : 25

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(javaVersion)
	}
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-kafka'

	implementation 'com.fasterxml.jackson.core:jackson-databind'
	implementation 'com.fasterxml.jackson.datatype:jackson-datatype-jsr310'
	implementation 'com.fasterxml.jackson.module:jackson-module-afterburner'

	implementation 'org.mongodb:mongodb-driver-sync'

	implementation 'net.openhft:zero-allocation-hashing:0.27ea1'	// XXHASH

	implementation 'org.springframework.boot:spring-boot-starter-web'
	implementation 'org.springframework.boot:spring-boot-starter-actuator'

	implementation 'org.apache.kafka:connect-json:4.4.0'

	compileOnly 'org.projectlombok:lombok:1.18.48'

	annotationProcessor 'org.projectlombok:lombok:1.18.48'

	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-kafka-test'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
	useJUnitPlatform()
}
